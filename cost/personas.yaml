# Issue #8 — cấu hình chi phí đồng bộ main ccb534b, 28/11/2026.
# Một lượt = một lần gọi answer(text) độc lập; nhiều lượt/phiên là nhiều lần phân tích,
# không phải chat có bộ nhớ. Chỉ tính token model, chưa gồm crawler/hosting/thuế/phí thẻ.
# Tham số tải lấy đúng dự toán spec.md §2 sau PR #21, chưa phải người dùng/tần suất đã đo.
# Chạy thử: python run.py simulate --try; CP4: python run.py simulate.
sessions: 50
seed: 42

users:
  low: 500
  base: 2000
  high: 5000
  source: "(tự ước tính) spec.md §2, PR #21 commit 818602f, chốt ngày 28/11/2026: 500/2000/5000 người dùng hoạt động/tháng cho pilot. Nền >61 triệu người mua online chỉ tham khảo thị trường, không chứng minh quy mô pilot: https://baodautu.vn/hon-61-trieu-nguoi-viet-mua-sam-online-kiem-soat-cac-san-thuong-mai-dien-tu-the-nao-d229437.html. P1–P4 chưa ghi tần suất dùng hệ thống."

# Tổng share=1; bình quân 3.9 phiên và 8.3 lượt/người/tháng, khớp spec.md §2.
# Cả ba nhóm dùng cùng pool sản phẩm để không tự suy phân khúc thích ngành hàng nào.
# inputs là mã catalog thật mà answer(text) hỗ trợ; không gửi JSON {mode,url,reviews}
# cũ và không tự gán URL hoặc số sao. Mỗi lần nạp trọn 20 hoặc 30 review theo catalog.
personas:
  - name: dung_it
    share: 0.50
    uses_per_month: 2
    turns_per_session: 1
    source: "(tự ước tính) spec.md §2, 28/11/2026: share 0.50, 2 phiên/tháng, 1 lượt/phiên. Tham khảo hành vi đọc review của P1/P3 trong evidence/interviews/; phỏng vấn chưa đo các tham số này."
    inputs: [SP01, SP02, SP03, SP04, SP05, SP06]
  - name: dung_vua
    share: 0.35
    uses_per_month: 4
    turns_per_session: 2
    source: "(tự ước tính) spec.md §2, 28/11/2026: share 0.35, 4 phiên/tháng, 2 lượt phân tích độc lập/phiên. Mức 4 lần mua hàng/tháng tham khảo https://congthuong.vn/trung-binh-1-nguoi-tieu-dung-viet-nam-mua-hang-truc-tuyen-4-lanthang-366168.html, không phải số lần dùng công cụ đã đo."
    inputs: [SP01, SP02, SP03, SP04, SP05, SP06]
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 10
    turns_per_session: 3
    source: "(tự ước tính) spec.md §2, 28/11/2026: share 0.15, 10 phiên/tháng, 3 lượt phân tích độc lập/phiên; chưa có bằng chứng phỏng vấn xác nhận phân khúc/tần suất dùng nặng này."
    inputs: [SP01, SP02, SP03, SP04, SP05, SP06]

# Nguồn input: data/catalog.json + data/DATA_CARD.md (150 review từ 6 sản phẩm),
# evidence/cp2_labels.csv và cp3_labels.csv là nhãn evidence, không đưa vào model.
# Ngày lấy: SP01–SP03 27/11/2026; SP04–SP06 28/11/2026.
# Mẫu này đo tải trên catalog, chưa đại diện toàn bộ đầu vào dán, payload extension,
# các mẫu 50–250 review hoặc tần suất G10/từ chối ngoài thực tế.
# Không dùng mô phỏng catalog làm bằng chứng accuracy trên dữ liệu độc lập:
# SP01–SP03 cũng đã được dùng xây benchmark, tỷ lệ đạt phải ghi đúng nguồn eval.

# Đơn giá snapshot đã đối chiếu 27/11/2026, USD/1M token Standard, không cache,
# ngữ cảnh ngắn (<272K); không dùng giá Batch/Flex/Fast hay giảm giá cache.
# prices chỉ so sánh đơn giá, KHÔNG tự chuyển MODEL_NAME hoặc gọi cả hai model.
# Khi báo cáo ghi rõ model đo token và model áp giá. Muốn đo token/chất lượng của
# từng model cần chạy riêng; các lượt không được giả định có cùng chất lượng.
prices:
  - model: gpt-6-luna
    input: 0.10
    output: 0.50
    source: "OpenAI https://developers.openai.com/api/docs/models/gpt-6-luna.md, xem 27/11/2026: Standard Input=0.10 USD/1M, Output=0.50 USD/1M, không cache. Cần xác minh quyền API thực tế của nhóm ở bước chạy live."
  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "OpenAI https://developers.openai.com/api/docs/models/gpt-6.2-sol.md, xem 27/11/2026: Standard Input=2.00 USD/1M, Output=10.00 USD/1M, không cache. So sánh giá, không khẳng định đã đo chất lượng model này."

usd_to_vnd:
  rate: 26030
  source: "Vietcombank https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx, truy xuất 27/11/2026; DateTime nguồn 11/27/2026 9:35:19 PM, USD Sell=26,030.00 VND/USD. Snapshot dự toán theo giá bán USD, chưa gồm phí hoặc thay đổi tỷ giá của thẻ."
